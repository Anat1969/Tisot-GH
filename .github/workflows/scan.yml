name: radar
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scan.py --max 45 --seconds 300
